<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05010f">
<title>NEON SLASH · 네온 슬래시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#00f0ff;--mg:#ff2bd6;--gd:#ffd23f;--rd:#ff1f3d;--bg:#05010f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none;width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;touch-action:pan-y;width:100%;max-width:370px;max-height:calc(100% - 8px);overflow-y:auto;padding:26px 22px 22px;border-radius:22px;background:linear-gradient(160deg,rgba(20,6,46,.82),rgba(6,2,20,.88));border:1px solid rgba(0,240,255,.35);box-shadow:0 0 0 1px rgba(255,43,214,.15) inset,0 0 40px rgba(0,240,255,.18),0 0 90px rgba(255,43,214,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;animation:cardIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.badge{display:inline-block;font:700 10px/1 Orbitron,sans-serif;letter-spacing:.25em;padding:7px 12px;border-radius:99px;color:var(--cy);border:1px solid rgba(0,240,255,.5);background:rgba(0,240,255,.08);margin-bottom:14px}
.logo{font:900 clamp(46px,15vw,70px)/.95 Orbitron,sans-serif;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center}
.logo span:first-child{color:#e9fdff;text-shadow:0 0 6px var(--cy),0 0 18px var(--cy),0 0 40px var(--cy);animation:flick 4s infinite}
.logo span:last-child{color:#ffe9fb;text-shadow:0 0 6px var(--mg),0 0 18px var(--mg),0 0 40px var(--mg)}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.sub{font-family:'Black Han Sans',sans-serif;font-size:18px;letter-spacing:.35em;color:rgba(255,255,255,.75);margin:10px 0 18px;padding-left:.35em}
.how{list-style:none;text-align:left;display:grid;gap:9px;margin:0 auto 18px;font-size:14px;color:rgba(255,255,255,.85)}
.how li{display:flex;align-items:center;gap:10px}
.how svg{flex:none;width:24px;height:24px}
.how b{color:var(--gd);font-weight:700}
.how b.red{color:#ff5d6e}
#name{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:500 16px 'Noto Sans KR',sans-serif;text-align:center;outline:none;margin-bottom:12px;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#name:focus{border-color:var(--cy);box-shadow:0 0 16px rgba(0,240,255,.35)}
#name::placeholder{color:rgba(255,255,255,.4)}
.btn{display:block;width:100%;height:56px;border:0;border-radius:16px;cursor:pointer;font:400 22px 'Black Han Sans',sans-serif;letter-spacing:.08em;color:#14001f;background:linear-gradient(90deg,var(--cy),#8b7bff 50%,var(--mg));box-shadow:0 0 24px rgba(0,240,255,.45),0 0 40px rgba(255,43,214,.3);touch-action:manipulation;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{margin-top:10px;height:48px;font-size:17px;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.25);box-shadow:none}
.bestline{margin-top:12px;font:700 12px Orbitron,sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.55);min-height:14px}
.swipehint{margin-top:10px;font-size:12px;color:rgba(255,255,255,.45)}
#hud{position:fixed;left:0;right:0;top:0;padding:14px 18px 0;pointer-events:none}
.hrow{display:flex;justify-content:space-between;align-items:flex-end}
.hl{font:700 10px Orbitron,sans-serif;letter-spacing:.25em;color:rgba(255,255,255,.55);margin-bottom:4px}
#score{font:900 32px/1 Orbitron,sans-serif;color:#eaffff;text-shadow:0 0 8px var(--cy),0 0 22px var(--cy);transform-origin:left center}
#score.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.18)}}
.tr{text-align:right}
#timer{font:900 32px/1 Orbitron,sans-serif;color:#ffeefc;text-shadow:0 0 8px var(--mg),0 0 22px var(--mg);transform-origin:right center}
#timer.warn{color:#fff;text-shadow:0 0 8px var(--rd),0 0 24px var(--rd);animation:bump .5s infinite}
#tbar{height:6px;margin-top:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
#tbarFill{height:100%;transform-origin:left center;background:linear-gradient(90deg,var(--cy),var(--mg));box-shadow:0 0 12px var(--mg)}
#fever{position:fixed;left:50%;top:94px;transform:translateX(-50%);font:900 16px Orbitron,sans-serif;letter-spacing:.2em;padding:8px 16px;border-radius:99px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);background:linear-gradient(90deg,#ff2bd6,#ff9a2e,#ffd23f,#7cff4f,#00f0ff,#9b6bff,#ff2bd6);background-size:300% 100%;animation:rainbow 1s linear infinite;box-shadow:0 0 24px rgba(255,43,214,.7);pointer-events:none;white-space:nowrap}
@keyframes rainbow{to{background-position:300% 0}}
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;font:900 clamp(96px,32vw,190px) Orbitron,sans-serif;color:#fff;text-shadow:0 0 12px var(--cy),0 0 40px var(--cy),0 0 80px var(--mg)}
#countdown.pop{animation:pop .7s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(2.4)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.8)}}
#mute{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,4,30,.6);color:#fff;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
#mute svg{width:20px;height:20px}
.tag{font:900 14px Orbitron,sans-serif;letter-spacing:.4em;color:var(--cy);text-shadow:0 0 10px var(--cy);padding-left:.4em}
.rname{margin-top:12px;font:700 17px 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.9)}
.grade{font:900 120px/1 Orbitron,sans-serif;margin-top:6px;animation:gradeIn .7s cubic-bezier(.2,1.6,.4,1) .25s both}
@keyframes gradeIn{from{opacity:0;transform:scale(3) rotate(-12deg)}to{opacity:1;transform:none}}
.rtitle{font:400 22px 'Black Han Sans',sans-serif;letter-spacing:.05em;margin-top:4px}
.rscore{font:900 52px/1.1 Orbitron,sans-serif;margin-top:14px;color:#fff;text-shadow:0 0 10px var(--cy),0 0 28px var(--cy)}
.rbest{font:700 12px Orbitron,sans-serif;letter-spacing:.15em;color:rgba(255,255,255,.55);margin-top:6px;min-height:16px}
.rbest.new{color:var(--gd);text-shadow:0 0 10px var(--gd);animation:bump .6s infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stats div{padding:12px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.stats b{display:block;font:900 22px Orbitron,sans-serif;color:#fff}
.stats span{font-size:11px;color:rgba(255,255,255,.6)}
.hint{margin-top:14px;font-size:12px;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="hud" class="hidden">
  <div class="hrow">
    <div><div class="hl">SCORE</div><div id="score">0</div></div>
    <div class="tr"><div class="hl">TIME</div><div id="timer">60</div></div>
  </div>
  <div id="tbar"><div id="tbarFill"></div></div>
</div>
<div id="fever" class="hidden">FEVER ×2</div>
<div id="countdown"></div>

<div id="intro" class="screen">
  <div class="card">
    <div class="badge">MADE WITH AI</div>
    <h1 class="logo"><span>NEON</span><span>SLASH</span></h1>
    <div class="sub">네온 슬래시</div>
    <ul class="how">
      <li><svg viewBox="0 0 24 24"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="rgba(0,240,255,.15)" stroke="#00f0ff" stroke-width="2"/></svg><span>화면을 쓸어서 네온 도형을 베세요 <b>+10</b></span></li>
      <li><svg viewBox="0 0 24 24"><polygon points="12,1.5 14.9,8.6 22.5,9.2 16.7,14.1 18.5,21.6 12,17.6 5.5,21.6 7.3,14.1 1.5,9.2 9.1,8.6" fill="rgba(255,210,63,.2)" stroke="#ffd23f" stroke-width="2" stroke-linejoin="round"/></svg><span>황금별은 <b>+50</b></span></li>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8.5" fill="#2a0010" stroke="#ff1f3d" stroke-width="2"/><rect x="10.8" y="8" width="2.4" height="6.5" rx="1.2" fill="#ff4d5e"/><circle cx="12" cy="17.2" r="1.4" fill="#ff4d5e"/></svg><span>폭탄을 베면 <b class="red">-5초</b></span></li>
      <li><svg viewBox="0 0 24 24"><polygon points="13,1 4,14 11,14 9,23 20,9 13,9" fill="rgba(255,43,214,.2)" stroke="#ff2bd6" stroke-width="2" stroke-linejoin="round"/></svg><span>한 번에 3개 이상 = <b>콤보 보너스</b></span></li>
      <li><svg viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="14" rx="7" fill="rgba(124,255,79,.15)" stroke="#7cff4f" stroke-width="2"/><path d="M8 9.5l4 5M12 9.5l-4 5M14.5 10.2c.4-.6 1.1-.9 1.8-.9 1 0 1.8.7 1.8 1.6 0 1.4-2.2 2-3.6 3.6h3.8" fill="none" stroke="#7cff4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>마지막 10초는 <b>점수 2배</b></span></li>
    </ul>
    <input id="name" maxlength="10" placeholder="닉네임 입력 (선택)" autocomplete="off" enterkeyhint="go">
    <button id="start" class="btn">게임 시작</button>
    <div id="bestIntro" class="bestline"></div>
    <div class="swipehint">카드 밖 화면을 쓸어서 미리 연습해 보세요</div>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="card">
    <div class="tag">TIME UP</div>
    <div id="rName" class="rname"></div>
    <div id="rGrade" class="grade">S</div>
    <div id="rTitle" class="rtitle"></div>
    <div id="rScore" class="rscore">0</div>
    <div id="rBest" class="rbest"></div>
    <div class="stats">
      <div><b id="sSliced">0</b><span>벤 개수</span></div>
      <div><b id="sCombo">0</b><span>최대 콤보</span></div>
      <div><b id="sAcc">0%</b><span>정확도</span></div>
    </div>
    <button id="again" class="btn">다시 하기</button>
    <button id="home" class="btn ghost">처음으로</button>
    <p class="hint">📸 스크린샷으로 점수를 인증하세요!</p>
  </div>
</div>

<button id="mute" aria-label="소리 켜기/끄기"></button>

}
function goHome() {
  cdTimers.forEach(clearTimeout); music.stop();
  state = 'intro'; introSpawn = 0.5;
  ui.result.classList.add('hidden'); ui.hud.classList.add('hidden'); ui.intro.classList.remove('hidden');
  restartAnim(ui.intro.querySelector('.card'));
}
$('start').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('home').addEventListener('click', goHome);
ui.name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startGame(); } });

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  trails.set(e.pointerId, { pts: [{ x: e.clientX, y: e.clientY, t: clock }], ended: false, lx: e.clientX, ly: e.clientY });
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  const tr = trails.get(e.pointerId); if (!tr || tr.ended) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null; if (!evs || !evs.length) evs = [e];
  for (const ev of evs) {
    const x = ev.clientX, y = ev.clientY, dx = x - tr.lx, dy = y - tr.ly;
    if (dx * dx + dy * dy < 4) continue;
    checkSlice(tr.lx, tr.ly, x, y);
    tr.pts.push({ x, y, t: clock }); tr.lx = x; tr.ly = y;
  }
});
const endPointer = e => { const tr = trails.get(e.pointerId); if (tr) tr.ended = true; initAudio(); };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend().catch(() => {}); else AC.resume().catch(() => {}); });

/* ---------- update ---------- */
function update(dt, rdt) {
  if (state === 'intro' || state === 'result') {
    introSpawn -= dt;
    if (introSpawn <= 0) { introSpawn = rand(0.8, 1.5); const n = Math.random() < 0.3 ? 2 : 1; for (let i = 0; i < n; i++) launch(Math.random() < 0.1 ? 'gold' : 'normal'); }
  }
  if (state === 'play') {
    elapsed += rdt; timeLeft -= rdt;
    if (!fever && timeLeft <= FEVER_AT) startFever();
    const sec = Math.max(0, Math.ceil(timeLeft));
    if (sec !== lastSec) { lastSec = sec; ui.timer.textContent = sec; if (sec <= 5 && sec > 0) { sfx.tick(); ui.timer.classList.add('warn'); } }
    ui.bar.style.transform = `scaleX(${Math.max(0, timeLeft / GAME_TIME)})`;
    spawnT -= dt;
    if (spawnT <= 0) { const p = Math.min(1, elapsed / (GAME_TIME - FEVER_AT)); spawnT = fever ? rand(0.5, 0.75) : rand(0.95, 1.35) - p * 0.45; wave(); }
    for (let i = queue.length - 1; i >= 0; i--) { queue[i].t -= dt; if (queue[i].t <= 0) { launch(queue[i].type); queue.splice(i, 1); } }
    if (timeLeft <= 0) endGame();
  }
  if (state === 'over') { overT -= rdt; if (overT <= 0) showResult(); }
  if (chain > 0) { chainT -= rdt; if (chainT <= 0) flushChain(); }

  for (const o of objs) {
    o.vy += G * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    if (o.vy > 0 && o.y > H + o.r * 2) o.gone = true;
    if (o.type === 'bomb' && Math.random() < 0.7) {
      const a = o.rot - 1.2;
      parts.push({ x: o.x + Math.cos(a) * o.r * 1.2, y: o.y + Math.sin(a) * o.r * 1.2, vx: rand(-60, 60), vy: rand(-90, 10), life: 0.3, max: 0.3, size: R * 0.18, color: Math.random() < 0.5 ? '#ff9a2e' : GOLD, drag: 1, g: 0 });
    }
  }
  objs = objs.filter(o => !o.dead && !o.gone);
  for (const h of halves) { h.vy += G * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.spin += h.vs * dt; h.life -= dt; }
  halves = halves.filter(h => h.life > 0 && h.y < H + R * 3);
  for (const p of parts) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 800) parts.splice(0, parts.length - 800);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const t of texts) { t.y += t.vy * rdt; t.vy *= Math.pow(0.15, rdt); t.life -= rdt; }
  texts = texts.filter(t => t.life > 0);
  for (const [id, tr] of trails) { while (tr.pts.length && clock - tr.pts[0].t > 0.1) tr.pts.shift(); if (tr.ended && !tr.pts.length) trails.delete(id); }
  shake = Math.max(0, shake - shake * rdt * 8 - rdt);
  flash = Math.max(0, flash - rdt * 1.8);
}

/* ---------- render ---------- */
function drawGrid(pulse) {
  const depth = H - horizonY, vx = W / 2;
  const base = fever ? `hsla(${(clock * 80) % 360},100%,62%,` : 'rgba(255,43,214,';
  ctx.lineWidth = 1.3; ctx.strokeStyle = base + (0.32 + pulse * 0.3) + ')';
  ctx.beginPath();
  const n = 12, spread = Math.max(W, H) * 0.11;
  for (let i = -n; i <= n; i++) { ctx.moveTo(vx + i * W * 0.015, horizonY); ctx.lineTo(vx + i * spread, H); }
  ctx.stroke();
  const N = 12, ph = (clock * (fever ? 1.3 : 0.55)) % 1;
  for (let k = 0; k < N; k++) {
    const z = (k + ph) / N, y = horizonY + depth * z * z;
    ctx.strokeStyle = base + (z * (0.6 + pulse * 0.4)) + ')'; ctx.lineWidth = 0.6 + z * 2;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  if (pulse > 0.02) { ctx.fillStyle = base + (pulse * 0.35) + ')'; ctx.fillRect(0, horizonY - 2, W, 4); }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  let pulse = 0;
  if (AC && music.on) { const now = AC.currentTime; for (let i = music.kicks.length - 1; i >= 0; i--) if (music.kicks[i] <= now) { pulse = Math.exp(-(now - music.kicks[i]) * 7); break; } }
  if (fever) { ctx.fillStyle = `hsla(${(clock * 90) % 360},100%,50%,${0.06 + pulse * 0.05})`; ctx.fillRect(0, 0, W, H); }
  drawGrid(pulse);

  ctx.save();
  if (shake > 0.5) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  for (const o of objs) {
    const sp = sprites[o.key]; if (!sp) continue;
    ctx.save(); ctx.translate(o.x, o.y);
    if (o.type === 'bomb') { const pl = 1 + Math.sin(clock * 12) * 0.06; ctx.scale(pl, pl); }
    ctx.rotate(o.rot);
    const s = o.r / R, sz = sp.size * s;
    ctx.drawImage(sp.c, -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
  }
  for (const h of halves) {
    const sp = sprites[h.key]; if (!sp) continue;
    const k = h.life / h.max, S = sp.size;
    ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.6);
    ctx.translate(h.x, h.y); ctx.rotate(h.spin + h.ang);
    ctx.beginPath(); if (h.side === 1) ctx.rect(-S, -S, 2 * S, S); else ctx.rect(-S, 0, 2 * S, S); ctx.clip();
    ctx.save(); ctx.rotate(-h.ang + h.rot0); const s = h.r / R, sz = S * s; ctx.drawImage(sp.c, -sz / 2, -sz / 2, sz, sz); ctx.restore();
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,255,255,${0.9 * k * k * k})`; ctx.fillRect(-h.r * 0.95, -3, h.r * 1.9, 6);
    ctx.restore();
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    const k = r.life / r.max, e = 1 - k, rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - e, 3));
    ctx.strokeStyle = hexA(r.color, k * 0.9); ctx.lineWidth = R * 0.12 * k + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
  }
  for (const p of parts) {
    const k = p.life / p.max, sz = p.size * (0.4 + 0.6 * k);
    ctx.globalAlpha = Math.min(1, k * 1.5); ctx.drawImage(getDot(p.color), p.x - sz, p.y - sz, sz * 2, sz * 2);
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'round';
  const tScale = R / 40;
  for (const tr of trails.values()) {
    const p = tr.pts; if (p.length < 2) continue;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 1; i < p.length; i++) {
        const f = i / (p.length - 1), age = 1 - Math.min(1, (clock - p[i].t) / 0.1);
        ctx.lineWidth = (pass ? 5 : 18) * f * tScale + 0.5;
        ctx.strokeStyle = pass ? `rgba(255,255,255,${0.95 * age})` : (fever ? `hsla(${(clock * 240) % 360},100%,60%,${0.4 * age})` : `rgba(0,240,255,${0.38 * age})`);
        ctx.beginPath(); ctx.moveTo(p[i - 1].x, p[i - 1].y); ctx.lineTo(p[i].x, p[i].y); ctx.stroke();
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const age = t.max - t.life, a = Math.min(1, t.life * 4);
    const pop = age < 0.15 ? 1 + (1 - age / 0.15) * (t.big ? 0.8 : 0.4) : 1;
    const fs = t.size * tScale * pop;
    ctx.font = `900 ${fs}px Orbitron, 'Black Han Sans', sans-serif`;
    ctx.globalAlpha = a; ctx.shadowColor = t.color; ctx.shadowBlur = t.big ? 26 : 12;
    if (t.big) { ctx.lineWidth = Math.max(2, fs * 0.07); ctx.strokeStyle = t.color; ctx.strokeText(t.s, t.x, t.y, W * 0.92); ctx.fillStyle = '#ffffff'; }
    else ctx.fillStyle = t.color;
    ctx.fillText(t.s, t.x, t.y, W * 0.92);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.restore();

  if (timeScale < 0.9) { ctx.fillStyle = `rgba(90,0,180,${(1 - timeScale) * 0.2})`; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.fillStyle = `rgba(${flashColor},${flash * 0.45})`; ctx.fillRect(0, 0, W, H); }

  if (shownScore !== score) {
    if (state === 'play' || state === 'over') { ui.score.textContent = score.toLocaleString(); if (shownScore >= 0) { ui.score.classList.remove('bump'); void ui.score.offsetWidth; ui.score.classList.add('bump'); } }
    shownScore = score;
  }
}

function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; clock += rdt;
  if (slowT > 0) slowT -= rdt;
  const target = slowT > 0 ? 0.3 : 1;
  timeScale += (target - timeScale) * Math.min(1, rdt * 10);
  update(rdt * timeScale, rdt);
  render();
  requestAnimationFrame(frame);
}

resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildSprites()).catch(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
